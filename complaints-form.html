<title>Настройка формы жалобы</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><div class="brand-icon"><img src="https://lh7-us.googleusercontent.com/rirXWnCVAAskqtGbpb8KBbSUWJafqWOPSC8nR5Z4OjYMdAr3Vt6_DiF_Uw_S3XbeGLlN9m6Pfd_ET-E8LPjCKNruw-wWsyN8137M8mtS7IY9TsrGF3Iap15_bzfNUF8-305JxpiyZAp-yHpQZmLbBfg" alt="ВС"></div>
      <div class="brand-text"><span class="brand-label">Настройка</span><span class="brand-name">Форма жалобы</span></div>
    </a>
    <div class="header-actions" style="margin-left:auto">
      <a href="complaints.html" class="btn btn-ghost btn-sm">← К форме</a>
      <a href="complaints-review.html" class="btn btn-ghost btn-sm">📋 Рассмотрение</a>
      <a href="complaints-settings.html" class="btn btn-ghost btn-sm">⚙ Настройки</a>
      <button class="btn btn-gold btn-sm" id="cfSaveBtn">💾 Сохранить</button>
    </div>
  </div>
</header>

<main>
  <section class="apps-body">
    <div class="container" style="max-width:960px">
      <div id="cfGuard" style="display:none"><div class="apps-guard-box"><div class="apps-guard-icon">⚠</div><h2>Доступ ограничен</h2><p>Только для администраторов.</p></div></div>
      <div id="cfRoot" style="display:none">
        <div class="te-hint" style="margin-bottom:14px">Настройте поля формы жалобы. Обязательные поля будут отмечены звёздочкой на форме. <b>Ключи</b> должны быть латиницей без пробелов.</div>
        <div class="msg-row">
          <div class="form-group msg-flex-2"><label>Заголовок страницы</label><input type="text" id="cfeTitle" class="msg-input"></div>
        </div>
        <div class="form-group"><label>Описание</label><textarea class="msg-input" id="cfeDesc" rows="2" style="resize:vertical;font-family:inherit"></textarea></div>
        <h3 style="margin-top:20px">Поля формы</h3>
        <div id="cfeFields"></div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn btn-ghost btn-sm" id="cfeAdd">＋ Добавить поле</button>
          <button class="btn btn-ghost btn-sm" id="cfeReset">↺ К дефолту</button>
        </div>
        <div class="form-msg" id="cfeMsg" style="margin-top:14px"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal-back" id="loginModal">
  <div class="modal"><button class="modal-close" aria-label="Закрыть">✕</button><h3>Вход</h3>
    <form><div class="form-group"><label>Email</label><input type="email" name="email" required></div><div class="form-group"><label>Пароль</label><input type="password" name="password" required></div><button class="btn btn-gold" style="width:100%" type="submit">Войти</button><div class="form-msg"></div></form></div>
</div>

<footer class="footer"><div class="container"><div class="footer-bottom"><span>© <span id="year"></span> · 1-я ОБрСпН · в/ч №12132</span></div></div></footer>

<script src="supabase-loader.js?v=90"></script>
<script src="config.js?v=90"></script>
<script src="main.js?v=90"></script>
<script src="auth.js?v=90"></script>
<script src="roles-engine.js?v=90"></script>
<script src="complaints-engine.js?v=90"></script>
<script>
document.getElementById("year").textContent=new Date().getFullYear();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let FORM=null;

async function boot(){
  const canEdit=window.VSRF_ROLES&&(window.VSRF_ROLES.can("complaints","form_edit")||window.VSRF_ROLES.can("complaints","settings"));
  if(!canEdit){$("cfGuard").style.display="";$("cfRoot").style.display="none";return}
  $("cfGuard").style.display="none";$("cfRoot").style.display="";
  FORM=await VSRF_COMPLAINTS.getForm();
  if(!FORM) FORM={id:1,title:"Жалоба на сотрудника",description:"",fields:[]};
  $("cfeTitle").value=FORM.title||"";
  $("cfeDesc").value=FORM.description||"";
  renderFields();
}

function renderFields(){
  const box=$("cfeFields");
  const fields=(FORM.fields||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  if(!fields.length){box.innerHTML='<div class="apps-empty"><p>Полей нет. Нажмите «+ Добавить поле».</p></div>';return}
  box.innerHTML=fields.map((f,i)=>`
    <div class="cfe-field" data-i="${i}">
      <div class="msg-row">
        <div class="form-group msg-flex-1"><label>Ключ *</label><input type="text" data-k="key" class="msg-input" value="${esc(f.key||"")}"></div>
        <div class="form-group msg-flex-2"><label>Название</label><input type="text" data-k="label" class="msg-input" value="${esc(f.label||"")}"></div>
        <div class="form-group"><label>Тип</label>
          <select data-k="type" class="msg-input">
            <option value="text" ${f.type==="text"?"selected":""}>Строка</option>
            <option value="textarea" ${f.type==="textarea"?"selected":""}>Многострочный</option>
            <option value="select" ${f.type==="select"?"selected":""}>Выбор</option>
          </select>
        </div>
        <div class="form-group" style="flex:0 0 auto"><label>&nbsp;</label><label class="cfe-req"><input type="checkbox" data-k="required" ${f.required?"checked":""}> Обяз.</label></div>
      </div>
      <div class="msg-row">
        <div class="form-group msg-flex-2"><label>Подсказка (placeholder)</label><input type="text" data-k="placeholder" class="msg-input" value="${esc(f.placeholder||"")}"></div>
        <div class="form-group msg-flex-2 cfe-opts" style="${f.type==="select"?"":"display:none"}"><label>Опции (по строкам)</label><textarea data-k="options" class="msg-input" rows="2" style="resize:vertical;font-family:inherit">${esc(Array.isArray(f.options)?f.options.join("\n"):"")}</textarea></div>
        <div class="form-group" style="flex:0 0 auto"><label>Порядок</label><input type="number" data-k="order" class="msg-input" value="${f.order||10}" style="width:80px"></div>
      </div>
      <div class="cfe-actions">
        <button class="btn btn-ghost btn-sm" data-up="${i}">↑</button>
        <button class="btn btn-ghost btn-sm" data-down="${i}">↓</button>
        <button class="btn btn-ghost btn-sm" data-del="${i}">🗑 Удалить</button>
      </div>
    </div>`).join("");
  box.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    if(!confirm("Удалить поле?")) return;
    FORM.fields.splice(+b.dataset.del,1);renderFields();
  }));
  box.querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.up;if(i<=0) return;
    const t=FORM.fields[i-1].order;FORM.fields[i-1].order=FORM.fields[i].order;FORM.fields[i].order=t;renderFields();
  }));
  box.querySelectorAll("[data-down]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.down;if(i>=FORM.fields.length-1) return;
    const t=FORM.fields[i+1].order;FORM.fields[i+1].order=FORM.fields[i].order;FORM.fields[i].order=t;renderFields();
  }));
  box.querySelectorAll(".cfe-field").forEach((el,i)=>{
    el.querySelectorAll("[data-k]").forEach(inp=>{
      inp.addEventListener("change",()=>{
        const k=inp.dataset.k;
        let v=inp.type==="checkbox"?inp.checked:inp.value;
        if(k==="order") v=parseInt(v)||0;
        if(k==="options") v=String(v).split("\n").map(x=>x.trim()).filter(Boolean);
        FORM.fields[i][k]=v;
        if(k==="type"){
          const optsBox=el.querySelector(".cfe-opts");
          if(optsBox) optsBox.style.display=v==="select"?"":"none";
        }
      });
    });
  });
}

$("cfeAdd").addEventListener("click",()=>{
  const maxOrd=Math.max(0,...(FORM.fields||[]).map(f=>f.order||0));
  FORM.fields=FORM.fields||[];
  FORM.fields.push({key:"field_"+(FORM.fields.length+1),label:"Новое поле",type:"text",required:false,placeholder:"",order:maxOrd+10});
  renderFields();
});

$("cfeReset").addEventListener("click",()=>{
  if(!confirm("Сбросить форму к настройкам по умолчанию?")) return;
  FORM.fields=[
    {key:"submitter_fio",label:"ФИО заявителя",type:"text",required:true,placeholder:"Иван Иванов",order:10},
    {key:"submitter_static",label:"Статик заявителя",type:"text",required:true,placeholder:"123-456",order:20},
    {key:"target_fio",label:"ФИО нарушителя",type:"text",required:true,placeholder:"Пётр Петров",order:40},
    {key:"target_static",label:"Статик нарушителя",type:"text",required:true,placeholder:"789-012",order:50},
    {key:"incident_date",label:"Дата и время инцидента",type:"text",required:true,placeholder:"04.08.2026 15:30",order:70},
    {key:"description",label:"Подробное описание",type:"textarea",required:true,placeholder:"Что произошло",order:90},
    {key:"evidence_url",label:"Ссылка на доказательство",type:"text",required:true,placeholder:"https://...",order:100}
  ];
  renderFields();
});

$("cfSaveBtn").addEventListener("click",async()=>{
  FORM.title=$("cfeTitle").value.trim()||"Жалоба на сотрудника";
  FORM.description=$("cfeDesc").value.trim();
  const msg=$("cfeMsg");
  msg.className="form-msg info";msg.textContent="Сохранение...";
  const r=await VSRF_COMPLAINTS.saveForm(FORM);
  if(!r.ok){msg.className="form-msg error";msg.textContent=r.error;return}
  msg.className="form-msg success";msg.textContent="✓ Сохранено";
});

if(window.VSRF_ROLES) VSRF_ROLES.onChange(boot);
setTimeout(boot,500);
</script>
